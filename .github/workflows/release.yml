name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  runner:
    runs-on: ubuntu-24.04
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update && sudo apt-get install -y nfpm
      - name: Build binaries, installer, formula, deb and rpm
        run: bun apps/runner/scripts/build-release.ts --release-url "https://github.com/${{ github.repository }}/releases/latest/download"
      - name: Smoke-test the linux-x64 binary
        run: |
          tar -xzf apps/runner/dist/release/foundry-linux-x64.tar.gz -C /tmp
          /tmp/foundry --version
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/runner/dist/release
          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            foundry-*.tar.gz SHA256SUMS install.sh foundry.rb *.deb *.rpm
      - name: Update the Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/foundry-dev/homebrew-tap" /tmp/tap
          cp apps/runner/dist/release/foundry.rb /tmp/tap/Formula/foundry.rb
          cd /tmp/tap && git add Formula/foundry.rb
          git -c user.name=foundry-release -c user.email=release@users.noreply.github.com commit -m "foundry ${GITHUB_REF_NAME}"
          git push

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }},ghcr.io/${{ github.repository }}/web:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/realtime:${{ github.ref_name }},ghcr.io/${{ github.repository }}/realtime:latest
