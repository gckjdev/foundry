# Foundry control plane: web + realtime + Postgres + Caddy (TLS).
# Local dev:   docker compose -f deploy/compose.yaml up postgres   (then `pnpm dev`)
# Production:  FOUNDRY_DOMAIN=foundry.example.com docker compose -f deploy/compose.yaml up -d
name: foundry

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: foundry
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundry"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/foundry
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: web
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/foundry
      ARTIFACTS_DIR: /data/artifacts
      FOUNDRY_PUBLIC_URL: https://${FOUNDRY_DOMAIN:-localhost}
      FOUNDRY_REALTIME_URL: wss://${FOUNDRY_DOMAIN:-localhost}/realtime
    volumes:
      - artifacts:/data/artifacts
      - ../github-app.pem:/app/github-app.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  realtime:
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/foundry
      FOUNDRY_SECRET: ${FOUNDRY_SECRET}
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FOUNDRY_DOMAIN: ${FOUNDRY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - realtime

volumes:
  pgdata:
  artifacts:
  caddy_data:
